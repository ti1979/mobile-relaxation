<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 検索結果に表示されるタイトル -->
  <title>{{ if .Title }}{{ .Title }} | {{ end }}Mobile Relaxation - Simple Breathwork App</title>
  
  <!-- 検索結果に表示される説明文（100〜120文字程度） -->
  <meta name="description" content="A simple, web-based breathwork and relaxation app. Practice Box Breathing, 4-7-8, and custom breathing patterns anytime on mobile.">

<!-- SNSシェア時に綺麗に表示させるOGPタグ -->
  <meta property="og:title" content="Mobile Relaxation - Breathwork App">
  <meta property="og:description" content="Simple breathing exercises for daily relaxation and mindfulness.">
  <meta property="og:type" content="website">
  
  <!-- Cloudflare Web Analytics -->
  <script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0c4ca592694b40aca92f14a79514c3c0"}'></script>
  <!-- End Cloudflare Web Analytics -->
  
  <style>
    :root { --ink: #5a5568; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; color: var(--ink);
      font-family: Georgia, 'Times New Roman', serif;
      background:
        radial-gradient(1200px 600px at 15% 0%, #f6efff 0%, transparent 60%),
        radial-gradient(1000px 700px at 90% 10%, #e8f3ec 0%, transparent 55%),
        linear-gradient(160deg, #fffdf8 0%, #f4eefb 45%, #eef5f1 100%);
      background-attachment: fixed;
    }
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none;
      background: radial-gradient(600px 600px at 50% 120%, rgba(214,199,240,.35), transparent 70%);
      animation: aura 12s ease-in-out infinite;
    }
    @keyframes aura { 0%,100% { transform: scale(1); opacity:.5 } 50% { transform: scale(1.25); opacity:.9 } }

    header { display:flex; justify-content:space-between; align-items:center; padding:18px 24px; }
    .brand { font-size:1rem; letter-spacing:.35em; text-transform:uppercase; opacity:.7; }

    .hero { max-width:680px; margin:40px auto 20px; text-align:center; padding:0 24px; }
    .hero h1 { font-size:clamp(2rem,5vw,3.2rem); font-weight:500; margin:0 0 18px; }
    .hero p { line-height:1.8; opacity:.85; }
    .hero .cta { display:inline-block; margin-top:22px; text-decoration:none; color:var(--ink);
      border:1px solid rgba(90,85,104,.35); border-radius:30px; padding:12px 34px;
      background:rgba(255,255,255,.6); backdrop-filter:blur(6px);
      transition:transform .6s ease, box-shadow .6s ease; }
    .hero .cta:hover { transform:translateY(-3px); box-shadow:0 10px 30px rgba(120,100,160,.18); }

    .gallery { max-width:1080px; margin:30px auto 40px; padding:0 24px;
      display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:22px; }
    .card { opacity:0; transform:translateY(24px) scale(.97);
      transition:opacity 1.1s ease var(--card-delay,0ms), transform 1.1s ease var(--card-delay,0ms); }
    .card.is-visible { opacity:1; transform:none; }
    .gallery.is-shuffling .card { opacity:0; transform:translateY(14px); transition-duration:.25s; }

    .card-inner { height:100%; border-radius:22px; padding:26px 22px; text-align:center;
      border:1px solid rgba(255,255,255,.8); backdrop-filter:blur(8px);
      box-shadow:0 6px 24px rgba(120,100,160,.10);
      animation:cardBreath 10s ease-in-out infinite; animation-delay:var(--card-delay,0ms); }
    @keyframes cardBreath {
      0%,100% { transform:scale(1);    box-shadow:0 6px 24px rgba(120,100,160,.10); }
      50%     { transform:scale(1.02); box-shadow:0 12px 34px rgba(120,100,160,.18); }
    }
    .card--sand       .card-inner { background:linear-gradient(160deg,#fffaf0,#f3e9d8); }
    .card--lavender   .card-inner { background:linear-gradient(160deg,#fbf9ff,#e6e0f2); }
    .card--sage       .card-inner { background:linear-gradient(160deg,#f6faf3,#e3ecdf); }
    .card--mist       .card-inner { background:linear-gradient(160deg,#f4fafd,#dfeaf0); }
    .card--cream      .card-inner { background:linear-gradient(160deg,#fffdf6,#faf6ee); }
    .card--terracotta .card-inner { background:linear-gradient(160deg,#fdf3ee,#f2ded4); }

    .card-tradition { font-size:.7rem; letter-spacing:.25em; text-transform:uppercase; opacity:.55; }
    .card-name { font-size:1.25rem; margin:12px 0 6px; font-weight:500; }
    .card-region { font-size:.8rem; opacity:.6; }
    .card-rhythm { font-size:.75rem; opacity:.5; margin-top:6px; letter-spacing:.08em; }
    .card-actions { margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .card-actions a, .card-actions button { font:inherit; font-size:.78rem; cursor:pointer;
      text-decoration:none; color:var(--ink); border:1px solid rgba(90,85,104,.3);
      border-radius:20px; padding:7px 16px; background:rgba(255,255,255,.7); transition:background .4s; }
    .card-actions a:hover, .card-actions button:hover { background:#fff; }

    .shuffle { text-align:center; margin-bottom:70px; }
    .shuffle button { font:inherit; cursor:pointer; letter-spacing:.2em; text-transform:uppercase;
      font-size:.75rem; color:var(--ink); background:transparent;
      border:1px solid rgba(90,85,104,.3); border-radius:30px; padding:12px 32px; transition:background .5s; }
    .shuffle button:hover { background:rgba(255,255,255,.6); }

    .modal { position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(90,85,104,.25); backdrop-filter:blur(6px); z-index:50; padding:24px; }
    .modal.open { display:flex; }
    .modal-box { max-width:520px; width:100%; max-height:80vh; overflow:auto;
      background:#fffdf9; border-radius:24px; padding:36px; position:relative;
      box-shadow:0 20px 60px rgba(90,85,104,.25); }
    .modal-box h2 { font-weight:500; margin-top:0; }
    .modal-close { position:absolute; top:14px; right:18px; border:none; background:none;
      font-size:1.4rem; cursor:pointer; color:var(--ink); }
    .modal-label { font-size:.7rem; letter-spacing:.25em; text-transform:uppercase; opacity:.5; }
    .modal p { line-height:1.8; }
  </style>
  
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "0c4ca592694b40aca92f14a79514c3c0"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>

<header>
  <div class="brand">{{ .Site.Title }}</div>
</header>

<section class="hero">
  <h1>{{ .Title }}</h1>
  <!-- JSで breathing_note のテキストを注入する領域 -->
  <p id="breathingNoteText">Take five minutes to let your breath settle...</p>
  <a class="cta" href="{{ "train/" | relURL }}">Start a session</a>
</section>

{{ $breaths := site.Data.breaths }}
<div class="gallery" id="trekGallery" data-breaths='{{ $breaths | jsonify | safeHTMLAttr }}'></div>
<div class="shuffle"><button id="trekAgain">Shuffle again</button></div>

<div class="modal" id="modal">
  <div class="modal-box">
    <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
    <div class="modal-label" id="modalTradition"></div>
    <h2 id="modalName"></h2>
    <p id="modalDesc"></p>
    <p class="modal-label">How to practice</p>
    <p id="modalHow"></p>
    <div class="card-actions">
      <a id="modalTrain" href="#">Start training</a>
      <a id="modalWiki" href="#" target="_blank" rel="noopener noreferrer">Wikipedia</a>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var gallery = document.getElementById("trekGallery");
  if (!gallery) return;

  var modal = document.getElementById("modal");
  var modalTradition = document.getElementById("modalTradition");
  var modalName = document.getElementById("modalName");
  var modalDesc = document.getElementById("modalDesc");
  var modalHow = document.getElementById("modalHow");
  var modalTrain = document.getElementById("modalTrain");
  var modalWiki = document.getElementById("modalWiki");

  var TRAIN_BASE = {{ "train/" | relURL }};

  var rawData = [];
  try {
    rawData = JSON.parse(gallery.getAttribute("data-breaths") || "[]");
  } catch (err) {
    console.error("breaths data could not be loaded:", err);
  }

  // breathing_note の抽出とテキスト注入
  var breathingNote = rawData.find(function(item) { return item.breathing_note; });
  if (breathingNote && breathingNote.breathing_note.text) {
    var noteEl = document.getElementById("breathingNoteText");
    if (noteEl) noteEl.textContent = breathingNote.breathing_note.text;
  }

  // カード描画用に breathing_note を除外した配列（id を保持している要素）を抽出
  var breaths = rawData.filter(function(item) { return item.id; });

  var CARD_COUNT = 9;

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function rhythmLabel(p) {
    if (!p) return "";
    var parts = [p.inhale + " in"];
    if (p.hold1) parts.push("hold " + p.hold1);
    parts.push(p.exhale + " out");
    if (p.hold2) parts.push("rest " + p.hold2);
    return parts.join(" / ");
  }

  function createCard(item, index) {
    var card = document.createElement("article");
    card.className = "card card--" + (item.color || "cream");
    card.style.setProperty("--card-delay", (index * 90) + "ms");

    var inner = document.createElement("div");
    inner.className = "card-inner";

    var tradition = document.createElement("div");
    tradition.className = "card-tradition";
    tradition.textContent = item.tradition || "Ancient Breath Technique";

    var name = document.createElement("div");
    name.className = "card-name";
    name.textContent = item.name;

    var region = document.createElement("div");
    region.className = "card-region";
    region.textContent = item.region || "";

    var rhythm = document.createElement("div");
    rhythm.className = "card-rhythm";
    rhythm.textContent = rhythmLabel(item.pattern);

    var actions = document.createElement("div");
    actions.className = "card-actions";

    var train = document.createElement("a");
    train.className = "card-link";
    train.href = TRAIN_BASE + "?b=" + encodeURIComponent(item.id);
    train.textContent = "TRAINING";

    var article = document.createElement("button");
    article.textContent = "ARTICLE";
    article.addEventListener("click", function () { openModal(item); });

    actions.appendChild(train);
    actions.appendChild(article);

    inner.appendChild(tradition);
    inner.appendChild(name);
    inner.appendChild(region);
    inner.appendChild(rhythm);
    inner.appendChild(actions);
    card.appendChild(inner);
    return card;
  }

  function renderCards() {
    gallery.innerHTML = "";
    var selected = shuffleArray(breaths).slice(0, CARD_COUNT);
    selected.forEach(function (item, i) {
      gallery.appendChild(createCard(item, i));
    });
    requestAnimationFrame(function () {
      var cards = gallery.querySelectorAll(".card");
      for (var i = 0; i < cards.length; i++) {
        (function (card, idx) {
          setTimeout(function () { card.classList.add("is-visible"); }, idx * 90);
        })(cards[i], i);
      }
    });
  }

  function openModal(item) {
    modalTradition.textContent = item.tradition || "";
    modalName.textContent = item.name;
    modalDesc.textContent = item.desc || "";
    modalHow.textContent = item.howto || "";
    modalTrain.href = TRAIN_BASE + "?b=" + encodeURIComponent(item.id);
    if (item.wiki) {
      modalWiki.href = item.wiki;
      modalWiki.style.display = "";
    } else {
      modalWiki.style.display = "none";
    }
    modal.classList.add("open");
  }

  function closeModal() { modal.classList.remove("open"); }

  document.getElementById("modalClose").addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeModal(); });

  document.getElementById("trekAgain").addEventListener("click", function () {
    gallery.classList.add("is-shuffling");
    setTimeout(function () {
      renderCards();
      gallery.classList.remove("is-shuffling");
    }, 260);
  });

  renderCards();
})();
</script>

</body>
</html>
